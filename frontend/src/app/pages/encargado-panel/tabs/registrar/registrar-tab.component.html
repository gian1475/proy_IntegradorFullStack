@if (mensajeOk()) {
  <div class="alert alert-success">{{ mensajeOk() }}</div>
}
@if (mensajeError()) {
  <div class="alert alert-danger">{{ mensajeError() }}</div>
}

<section class="card card-body mb-4">
  <h2 class="h6 fw-bold text-primary mb-3">Registrar préstamo en sala</h2>
  <p class="text-body-secondary small">Horario de atención: de 08:00 a 20:00. La hora límite es de 3 horas y nunca pasa del cierre.</p>
  <form (ngSubmit)="registrarPrestamo()">
    <div class="row g-3 mb-3">
      <div class="col-sm-6 col-lg-4">
        <label class="form-label" for="dni">DNI del prestatario</label>
        <input class="form-control" id="dni" name="dni" maxlength="8" placeholder="8 dígitos" [(ngModel)]="dniPrestatario" />
      </div>
      <div class="col-sm-6 col-lg-4">
        <label class="form-label" for="buscar-libro">Buscar libro</label>
        <input class="form-control" id="buscar-libro" name="buscarLibro" placeholder="Título, autor, categoría o ISBN"
               [ngModel]="busqueda()" (ngModelChange)="busqueda.set($event)" />
      </div>
      <div class="col-sm-6 col-lg-4">
        <label class="form-label" for="libro">Libro ({{ librosPrestables().length }})</label>
        <select class="form-select" id="libro" name="libro" [(ngModel)]="idLibroSeleccionado">
          <option [ngValue]="null">Seleccione un libro</option>
          @for (l of librosPrestables(); track l.idLibro) {
            <option [ngValue]="l.idLibro">{{ l.titulo }} ({{ etiquetaEstado(l.estadoLibro) }}, stock: {{ l.stock }})</option>
          }
        </select>
      </div>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary btn-sm">Registrar préstamo</button>
    </div>
  </form>
</section>
