<div class="login-layout">
  <app-header></app-header>

  <main class="login-main">
    <div class="login-card">
      <h1 class="card-title">Inicio de Sesión</h1>

      @if (errorMessage()) {
        <div style="background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 0.65rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.25rem;">
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="username">Ingresa tu correo</label>
          <input
            id="username"
            type="email"
            class="form-input"
            placeholder="correo@alejandria.edu.pe"
            autocomplete="username"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Ingresa tu contraseña</label>
          <!-- ver contraseña: el boton cambia el campo de password a text (no envia el formulario: type="button") -->
          <div class="campo-contrasena">
            <input
              id="password"
              [type]="verContrasena() ? 'text' : 'password'"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button type="button" class="btn-ver-contrasena" aria-controls="password"
                    [attr.aria-label]="verContrasena() ? 'Ocultar la contraseña' : 'Ver la contraseña'"
                    (click)="verContrasena.set(!verContrasena())">
              {{ verContrasena() ? 'Ocultar' : 'Ver' }}
            </button>
          </div>
        </div>

        <div class="forgot-link-wrapper">
          <span class="forgot-link">¿Olvidaste tu contraseña? Acércate a la ventanilla de la biblioteca.</span>
        </div>

        <div class="button-group-row">
          <button type="button" routerLink="/registro" class="btn-register">
            Registrarse
          </button>
          <button type="submit" class="btn-submit" [disabled]="cargando()">
            {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
