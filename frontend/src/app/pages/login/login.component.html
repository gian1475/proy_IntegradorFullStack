<div class="auth-page">
  <div class="auth-card">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
      </svg>
    </div>

    <h1 class="auth-title">Luz del Saber</h1>
    <p class="auth-subtitle">PORTAL DE CONOCIMIENTO</p>

    @if (errorMessage()) {
      <div style="background-color: #fee2e2; color: #b91c1c; padding: 0.65rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem;">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <div class="label-row">
          <label for="email">Correo electrónico</label>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input
            id="email"
            type="email"
            class="form-input"
            placeholder="ejemplo@correo.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <a href="javascript:void(0)" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            id="password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando()">
        {{ cargando() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="divider">
      <span>o</span>
    </div>

    <div class="auth-footer">
      <span>¿Aún no tienes cuenta?</span>
      <a routerLink="/registro" class="register-link">Regístrate como nuevo usuario</a>
    </div>

    <div>
      <a routerLink="/" class="back-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver al Inicio
      </a>
    </div>
  </div>
</div>
