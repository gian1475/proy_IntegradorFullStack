<div class="register-page">
  <div class="register-card">
    <!-- Glowing Open Book Logo from Figura 30 -->
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
      </svg>
    </div>

    <h1 class="register-title">Crea tu Cuenta</h1>
    <p class="register-subtitle">ÚNETE A LUZ DEL SABER</p>

    @if (errorMessage()) {
      <div style="background-color: #fee2e2; color: #b91c1c; padding: 0.65rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem;">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onRegister()">
      <!-- Nombre y Apellido en 2 columnas -->
      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input
              id="nombre"
              type="text"
              class="form-input"
              placeholder="Ingrese su nombre"
              [(ngModel)]="nombre"
              name="nombre"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input
              id="apellido"
              type="text"
              class="form-input"
              placeholder="Ingrese su apellido"
              [(ngModel)]="apellido"
              name="apellido"
              required
            />
          </div>
        </div>
      </div>

      <!-- DNI (8 dígitos) -->
      <div class="form-group">
        <label for="dni">DNI</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <line x1="7" y1="8" x2="17" y2="8"></line>
              <line x1="7" y1="12" x2="13" y2="12"></line>
            </svg>
          </span>
          <input
            id="dni"
            type="text"
            maxlength="8"
            class="form-input"
            placeholder="Ingrese su DNI"
            [(ngModel)]="dni"
            name="dni"
            required
          />
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input
            id="correo"
            type="email"
            class="form-input"
            placeholder="Ingrese su correo electrónico"
            [(ngModel)]="correo"
            name="correo"
            required
          />
        </div>
      </div>

      <!-- Contraseña y Confirmar Contraseña en 2 columnas -->
      <div class="form-grid">
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              id="contrasena"
              type="password"
              class="form-input"
              placeholder="Ingrese una contraseña"
              [(ngModel)]="contrasena"
              name="contrasena"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              id="confirmarContrasena"
              type="password"
              class="form-input"
              placeholder="Repita la contraseña"
              [(ngModel)]="confirmarContrasena"
              name="confirmarContrasena"
              required
            />
          </div>
        </div>
      </div>

      <!-- Términos y Condiciones Checkbox -->
      <div class="terms-row">
        <input type="checkbox" id="terms" [(ngModel)]="aceptoTerminos" name="terms" required />
        <label for="terms">
          Acepto las <a href="javascript:void(0)">políticas de privacidad</a> y los <a href="javascript:void(0)">términos de uso</a> de la biblioteca.
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="!aceptoTerminos">
        Registrarme
      </button>
    </form>

    <div class="register-footer">
      <span>¿Ya tienes una cuenta?</span>
      <a routerLink="/login" class="login-link">Inicia sesión aquí</a>
    </div>
  </div>
</div>
