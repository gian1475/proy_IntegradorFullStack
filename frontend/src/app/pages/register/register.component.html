<div class="register-layout">
  <app-header></app-header>

  <main class="register-main">
    <div class="register-card">
      <h1 class="card-title">Registro de Nuevos Usuarios</h1>

      @if (errorMessage()) {
        <div style="background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 0.65rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.25rem;">
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onRegister()">
        <div class="form-row">
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            type="text"
            class="form-input"
            placeholder="Ingrese su nombre"
            [(ngModel)]="nombre"
            name="nombre"
            required
          />
        </div>

        <div class="form-row">
          <label for="apellido">Apellido</label>
          <input
            id="apellido"
            type="text"
            class="form-input"
            placeholder="Ingrese su apellido"
            [(ngModel)]="apellido"
            name="apellido"
            required
          />
        </div>

        <div class="form-row">
          <label for="dni">DNI / CDE</label>
          <input
            id="dni"
            type="text"
            maxlength="8"
            class="form-input"
            placeholder="8 dígitos"
            [(ngModel)]="dni"
            name="dni"
            required
          />
        </div>

        <div class="form-row">
          <label for="correo">Usuario / Correo</label>
          <input
            id="correo"
            type="email"
            class="form-input"
            placeholder="usuario@alejandria.edu.pe"
            [(ngModel)]="correo"
            name="correo"
            required
          />
        </div>

        <div class="form-row">
          <label for="contrasena">Contraseña</label>
          <input
            id="contrasena"
            type="password"
            class="form-input"
            placeholder="••••••••"
            [(ngModel)]="contrasena"
            name="contrasena"
            required
          />
        </div>

        <div class="form-row">
          <label for="confirmar">Confirmar</label>
          <input
            id="confirmar"
            type="password"
            class="form-input"
            placeholder="Repita la contraseña"
            [(ngModel)]="confirmarContrasena"
            name="confirmar"
            required
          />
        </div>

        <div class="btn-submit-row">
          <button type="submit" class="btn-submit" [disabled]="cargando()">
            {{ cargando() ? 'Registrando...' : 'Registrarse' }}
          </button>
        </div>
      </form>

      <div class="card-footer">
        <span>¿Ya tienes una cuenta?</span>
        <a routerLink="/login"> Iniciar sesión aquí</a>
      </div>
    </div>
  </main>
</div>
