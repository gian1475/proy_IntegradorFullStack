<div class="panel-layout">
  <app-header></app-header>

  <main class="panel-main">
    <h1 class="panel-title">Panel del Administrador</h1>
    <p class="panel-subtitle">Bienvenido, {{ authService.usuarioActual()?.nombre }}. Coordinación bibliotecaria.</p>

    <nav class="panel-tabs">
      <button [class.active]="pestana() === 'dashboard'" (click)="pestana.set('dashboard')">Dashboard</button>
      <button [class.active]="pestana() === 'libros'" (click)="pestana.set('libros')">Libros</button>
      <button [class.active]="pestana() === 'prestamos'" (click)="pestana.set('prestamos')">Préstamos activos</button>
      <button [class.active]="pestana() === 'reservas'" (click)="pestana.set('reservas')">Reservas</button>
      <button [class.active]="pestana() === 'reportes'" (click)="pestana.set('reportes')">Reportes</button>
      <button [class.active]="pestana() === 'monitoreo'" (click)="pestana.set('monitoreo')">Monitoreo</button>
    </nav>

    @switch (pestana()) {
      @case ('dashboard') { <app-dashboard-tab /> }
      @case ('libros') { <app-libros-tab /> }
      @case ('prestamos') { <app-prestamos-tab /> }
      @case ('reservas') { <app-reservas-admin-tab /> }
      @case ('reportes') { <app-reportes-tab /> }
      @case ('monitoreo') { <app-monitoreo-tab /> }
    }
  </main>
</div>
