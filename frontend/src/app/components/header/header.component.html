<header class="header-container">
  <div class="brand" routerLink="/">
    <div class="logo-frame" aria-label="Logo Biblioteca de Alejandría">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
    </div>
    <div class="brand-texts">
      <span class="brand-title">Biblioteca de Alejandría</span>
      <span class="brand-subtitle">Reserva de Libros</span>
    </div>
  </div>

  <div class="search-wrapper">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>
    <input
      type="text"
      class="search-input"
      placeholder="Buscar libros a tu elección..."
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />
  </div>

  <div class="user-action">
    @if (!authService.usuarioActual()) {
      <a routerLink="/login" class="btn-login-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Iniciar Sesión</span>
      </a>
    } @else {
      <button 
        class="avatar-btn" 
        (click)="toggleUserMenu()"
        title="Menú de usuario" 
        aria-label="Menú de usuario"
      >
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </button>
    }

    @if (showUserMenu()) {
      <div class="user-dropdown" (click)="closeUserMenu()">
        @if (authService.usuarioActual(); as user) {
          <div style="padding: 0.6rem 0.85rem; font-size: 0.82rem; color: #1e293b; background-color: #f7f3eb; border-radius: 6px; margin-bottom: 0.35rem;">
            <strong>{{ user.nombre }} {{ user.apellido }}</strong>
            <div style="font-size: 0.75rem; color: #854d0e;">{{ user.rol }}</div>
          </div>
        }

        <a routerLink="/" class="dropdown-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Inicio</span>
        </a>
        <a routerLink="/catalogo" class="dropdown-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>Catálogo</span>
        </a>
        <div class="dropdown-divider"></div>

        <a href="javascript:void(0)" class="dropdown-item" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar Sesión</span>
        </a>
      </div>
    }
  </div>
</header>
