<section class="hero-banner-container" aria-label="Novedades de la Biblioteca">
  <div class="banner-box">
    <div 
      class="banner-bg-img" 
      [style.backgroundImage]="'url(' + currentSlide().image + ')'"
    ></div>

    <button class="nav-btn prev-btn" (click)="prevSlide()" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="banner-content">
      <span class="badge-novedad">{{ currentSlide().tag }}</span>
      <h1 class="hero-title">{{ currentSlide().title }}</h1>
      <p class="hero-subtitle">{{ currentSlide().subtitle }}</p>
      <div class="banner-actions">
        <a routerLink="/catalogo" class="btn-catalog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          Catálogo Bibliográfico
        </a>
        <button class="btn-location" (click)="onLocationClick()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Horarios y Sala
        </button>
      </div>
    </div>

    <button class="nav-btn next-btn" (click)="nextSlide()" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <div class="carousel-dots">
      @for (slide of slides; track slide.id; let i = $index) {
        <span 
          class="dot" 
          [class.active]="currentSlideIndex() === i"
          (click)="goToSlide(i)"
        ></span>
      }
    </div>
  </div>
</section>
