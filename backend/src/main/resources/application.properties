spring.application.name=biblioteca-alejandria

# Las credenciales se leen de variables de entorno o del archivo backend/.env (no se sube a Git)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate: Hibernate solo revisa que las entidades coincidan con las tablas; nunca cambia la BD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# despliegue (B5): en un servidor en la nube el puerto llega en la variable PORT; en la PC es 8080
server.port=${PORT:8080}

# Spring Security: los usuarios están en nuestra BD (AuthService), no se usa el usuario de prueba que crea Spring
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Sesión: se cierra tras 15 minutos sin actividad (RNF04). Cada petición renueva el plazo.
app.sesion.inactividad-minutos=15

# Horario de atención (RF01 y RF05): fuera de este horario no se registran préstamos y la hora límite no pasa del cierre.
# Para probar de noche se puede poner, por ejemplo, app.horario.cierre=23:59 (y volverlo a 20:00 antes de la demo).
app.horario.apertura=08:00
app.horario.cierre=20:00

# ---------- Monitoreo (Spring Boot Actuator) ----------
# Puerto aparte y solo accesible desde la misma PC (127.0.0.1): http://localhost:8081/actuator
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# RNF03 (monitoreo): cuenta cuantas peticiones respondieron en 2 s o menos (para el % de la pestana Monitoreo)
management.metrics.distribution.slo.http.server.requests=2s
management.info.env.enabled=true
# Sin tildes: este archivo se lee en ISO-8859-1 y las tildes se verían mal en /actuator/info
info.app.nombre=Sistema de Prestamos - Biblioteca de Alejandria
info.app.version=@project.version@
