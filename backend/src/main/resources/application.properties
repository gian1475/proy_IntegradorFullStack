spring.application.name=demo

# Las credenciales se leen de variables de entorno o del archivo backend/.env (no se sube a Git)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# ---------- Monitoreo (Spring Boot Actuator) ----------
# Puerto aparte y solo accesible desde la misma PC (127.0.0.1): http://localhost:8081/actuator
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
# Sin tildes: este archivo se lee en ISO-8859-1 y las tildes se verían mal en /actuator/info
info.app.nombre=Sistema de Prestamos - Biblioteca de Alejandria
info.app.version=@project.version@
